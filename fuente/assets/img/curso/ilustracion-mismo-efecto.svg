<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img"
     aria-label="Dos recomendaciones en hoja: una con sello de correcta pero con el texto ilegible, otra bien escrita pero con sello de equivocada. Las flechas de las dos se juntan y caen en la misma caja de archivo, rotulada no se usa.">
  <!-- Ilustración de marca · Scala Learning · Unidad 2, tema 4
       Concepto (DI): una recomendación técnicamente correcta que no logra comunicarse
       con claridad tiene, en la práctica, el mismo efecto que una equivocada: no se usa.
       Izquierda: la correcta (sello amarillo) con el texto en garabato; centro: la
       equivocada (sello ✕) con el texto limpio; derecha: la misma caja para las dos. -->
  <defs>
    <linearGradient id="ilu-mismoefecto-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F1ECF7"/>
      <stop offset="55%"  stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
    <filter id="ilu-mismoefecto-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#303651" flood-opacity="0.16"/>
    </filter>
    <!-- El análisis que respalda cada hoja: barras y tendencia, como en la ilustración del criterio -->
    <g id="ilu-mismoefecto-grafico">
      <rect x="0"  y="30" width="16" height="26" rx="4" fill="#503B96" opacity=".35"/>
      <rect x="24" y="18" width="16" height="38" rx="4" fill="#503B96" opacity=".55"/>
      <rect x="48" y="6"  width="16" height="50" rx="4" fill="#503B96"/>
      <polyline points="0,24 24,14 48,6 80,2" fill="none" stroke="#503B96" stroke-width="3"
                stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
      <circle cx="80" cy="2" r="4" fill="#503B96" opacity=".7"/>
    </g>
  </defs>

  <rect width="1200" height="400" rx="18" fill="url(#ilu-mismoefecto-fondo)"/>

  <!-- ══ Hoja 1 · técnicamente correcta, pero no se entiende ══ -->
  <g filter="url(#ilu-mismoefecto-sombra)">
    <rect x="70" y="64" width="250" height="170" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- el texto: garabato ilegible -->
  <g fill="none" stroke="#503B96" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M98 94 q6 -10 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
    <path d="M98 114 q5 -7 10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0 t10 0"/>
    <path d="M98 134 q6 -10 12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0 t12 0"/>
  </g>
  <use href="#ilu-mismoefecto-grafico" x="98" y="158"/>
  <!-- sello: correcta (el único amarillo) -->
  <circle cx="294" cy="92" r="22" fill="#F8B716"/>
  <path d="M283 92 l8 8 15 -17" fill="none" stroke="#303651" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ══ Hoja 2 · se lee perfectamente, pero está equivocada ══ -->
  <g filter="url(#ilu-mismoefecto-sombra)">
    <rect x="356" y="64" width="250" height="170" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="384" y="86"  width="104" height="9" rx="4.5" fill="#303651" opacity=".85"/>
  <rect x="384" y="106" width="150" height="9" rx="4.5" fill="#303651" opacity=".28"/>
  <rect x="384" y="126" width="122" height="9" rx="4.5" fill="#303651" opacity=".28"/>
  <use href="#ilu-mismoefecto-grafico" x="384" y="158"/>
  <!-- sello: equivocada -->
  <circle cx="580" cy="92" r="22" fill="#303651" opacity=".5"/>
  <path d="M571 83 l18 18 M589 83 l-18 18" fill="none" stroke="#FFFFFF" stroke-width="4.5"
        stroke-linecap="round"/>

  <!-- ══ La caja de archivo: el mismo destino para las dos ══ -->
  <!-- interior -->
  <rect x="852" y="166" width="300" height="90" rx="10" fill="#CFC8E4"/>
  <!-- hojas ya guardadas -->
  <g transform="rotate(-2.5 1002 218)">
    <rect x="876" y="178" width="252" height="80" rx="5" fill="#FFFFFF"/>
    <rect x="898" y="196" width="110" height="7" rx="3.5" fill="#303651" opacity=".18"/>
    <rect x="898" y="212" width="170" height="7" rx="3.5" fill="#303651" opacity=".12"/>
  </g>
  <g transform="rotate(2 1014 230)">
    <rect x="896" y="190" width="236" height="80" rx="5" fill="#FBF8F3"/>
    <rect x="918" y="208" width="96" height="7" rx="3.5" fill="#303651" opacity=".14"/>
    <rect x="918" y="224" width="150" height="7" rx="3.5" fill="#303651" opacity=".1"/>
  </g>
  <!-- frente de la caja -->
  <g filter="url(#ilu-mismoefecto-sombra)">
    <rect x="836" y="218" width="330" height="150" rx="16" fill="#503B96" opacity=".9"/>
  </g>
  <rect x="916" y="276" width="170" height="38" rx="8" fill="#FFFFFF" opacity=".14"/>
  <text x="1001" y="301" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif"
        font-size="18" font-weight="600" letter-spacing="2.5" fill="#FFFFFF" opacity=".95">NO SE USA</text>

  <!-- ══ Las dos flechas se funden en una y caen en la caja (la de la correcta pasa por encima de la otra hoja) ══ -->
  <g fill="none" stroke="#503B96" stroke-width="3" stroke-linecap="round" opacity=".5">
    <path d="M322 100 C 360 0, 880 0, 946 192" stroke-dasharray="7 7"/>
    <path d="M608 150 C 780 150, 930 112, 946 192" stroke-dasharray="7 7"/>
  </g>
  <path d="M938 182 l8 12 8 -12" fill="none" stroke="#503B96" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" opacity=".7"/>
</svg>
