<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img"
     aria-label="A la izquierda, la respuesta que la IA ya entregó, con una cifra destacada; al centro, esa misma cifra cotejada contra un registro que no es la IA y confirmada; a la derecha, la persona que tiene que aprobarla recibe la recomendación con el sello de respaldo.">
  <!-- Ilustración de marca · Scala Learning · Unidad 2
       Segunda mitad de ilustracion-criterio.svg (U1): la respuesta ya obtenida
       (izquierda) cruza la auditoría —se comprueba contra una fuente ajena a la IA—
       (centro) y llega a quien tiene que aprobarla como una recomendación que puede
       respaldar (derecha). Un solo amarillo: la confirmación contra la fuente. -->
  <defs>
    <linearGradient id="ilu-otra-mitad-fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#F1ECF7"/>
      <stop offset="55%"  stop-color="#F4EFE7"/>
      <stop offset="100%" stop-color="#FBF7EF"/>
    </linearGradient>
    <filter id="ilu-otra-mitad-sombra" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#303651" flood-opacity="0.16"/>
    </filter>
    <!-- La cifra que sostiene la alternativa: el mismo token viaja por las tres estaciones -->
    <g id="ilu-otra-mitad-cifra">
      <rect width="74" height="32" rx="8" fill="#503B96"/>
      <rect x="12" y="10" width="46" height="6" rx="3" fill="#fff" opacity=".85"/>
      <rect x="12" y="20" width="28" height="5" rx="2.5" fill="#fff" opacity=".5"/>
    </g>
  </defs>

  <rect width="1200" height="460" rx="18" fill="url(#ilu-otra-mitad-fondo)"/>

  <!-- ── 1 · La respuesta que la IA ya entregó (la tarjeta con que cerró la U1, sin sello aún) ── -->
  <g filter="url(#ilu-otra-mitad-sombra)">
    <rect x="60" y="112" width="252" height="236" rx="16" fill="#FFFFFF"/>
  </g>
  <rect x="90" y="146" width="104" height="9" rx="4.5" fill="#303651" opacity=".85"/>
  <rect x="90" y="166" width="150" height="9" rx="4.5" fill="#303651" opacity=".28"/>
  <use href="#ilu-otra-mitad-cifra" x="210" y="140"/>
  <!-- barras -->
  <rect x="90"  y="268" width="20" height="34" rx="5" fill="#503B96" opacity=".35"/>
  <rect x="122" y="248" width="20" height="54" rx="5" fill="#503B96" opacity=".55"/>
  <rect x="154" y="228" width="20" height="74" rx="5" fill="#503B96"/>
  <!-- tendencia (todavía violeta: nada está confirmado) -->
  <polyline points="90,238 122,222 154,206 196,190 238,206"
            fill="none" stroke="#503B96" stroke-width="4" opacity=".6"
            stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="238" cy="206" r="6" fill="#503B96" opacity=".6"/>

  <!-- La cifra sale de la respuesta hacia la comprobación: trazo punteado, aún no verificado -->
  <path d="M312 156 C 392 156, 392 300, 466 300" stroke="#503B96" stroke-width="3"
        stroke-dasharray="7 7" fill="none" opacity=".5" stroke-linecap="round"/>

  <!-- ── 2 · La auditoría: la cifra cotejada contra un registro que no es la IA ── -->
  <g filter="url(#ilu-otra-mitad-sombra)">
    <rect x="470" y="92" width="260" height="276" rx="16" fill="#FFFFFF"/>
  </g>
  <!-- cabecera navy: es un registro de la organización, no una tarjeta de la IA -->
  <path d="M486 92 h228 a16 16 0 0 1 16 16 v26 h-260 v-26 a16 16 0 0 1 16 -16 z" fill="#303651"/>
  <rect x="492" y="108" width="54" height="7" rx="3.5" fill="#fff" opacity=".7"/>
  <rect x="690" y="108" width="20" height="7" rx="3.5" fill="#fff" opacity=".4"/>
  <!-- rejilla del calendario interno de campañas anteriores -->
  <g fill="#303651" opacity=".12">
    <rect x="492" y="152" width="26" height="22" rx="4"/><rect x="524" y="152" width="26" height="22" rx="4"/><rect x="556" y="152" width="26" height="22" rx="4"/><rect x="588" y="152" width="26" height="22" rx="4"/><rect x="620" y="152" width="26" height="22" rx="4"/><rect x="652" y="152" width="26" height="22" rx="4"/><rect x="684" y="152" width="26" height="22" rx="4"/>
    <rect x="492" y="180" width="26" height="22" rx="4"/><rect x="524" y="180" width="26" height="22" rx="4"/><rect x="556" y="180" width="26" height="22" rx="4"/><rect x="684" y="180" width="26" height="22" rx="4"/>
    <rect x="492" y="208" width="26" height="22" rx="4"/><rect x="524" y="208" width="26" height="22" rx="4"/><rect x="556" y="208" width="26" height="22" rx="4"/><rect x="588" y="208" width="26" height="22" rx="4"/><rect x="620" y="208" width="26" height="22" rx="4"/><rect x="652" y="208" width="26" height="22" rx="4"/><rect x="684" y="208" width="26" height="22" rx="4"/>
    <rect x="492" y="236" width="26" height="22" rx="4"/><rect x="524" y="236" width="26" height="22" rx="4"/><rect x="556" y="236" width="26" height="22" rx="4"/><rect x="588" y="236" width="26" height="22" rx="4"/><rect x="620" y="236" width="26" height="22" rx="4"/><rect x="652" y="236" width="26" height="22" rx="4"/><rect x="684" y="236" width="26" height="22" rx="4"/>
  </g>
  <!-- las semanas de campañas pasadas que cayeron de forma parecida -->
  <g fill="#303651" opacity=".42">
    <rect x="588" y="180" width="26" height="22" rx="4"/><rect x="620" y="180" width="26" height="22" rx="4"/><rect x="652" y="180" width="26" height="22" rx="4"/>
  </g>
  <!-- la cifra de la IA, encontrada en el registro, junto a la línea propia del registro -->
  <use href="#ilu-otra-mitad-cifra" x="492" y="284"/>
  <rect x="620" y="292" width="88" height="8" rx="4" fill="#303651" opacity=".28"/>
  <rect x="620" y="308" width="56" height="8" rx="4" fill="#303651" opacity=".28"/>
  <!-- ÚNICO AMARILLO: la confirmación contra una fuente ajena a la IA -->
  <circle cx="578" cy="300" r="26" fill="#F8B716"/>
  <path d="M565 300 l 9 10 18 -20" fill="none" stroke="#303651" stroke-width="5"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Después de la comprobación el trazo es continuo -->
  <path d="M730 230 C 790 230, 812 230, 858 230" stroke="#503B96" stroke-width="3"
        fill="none" opacity=".75" stroke-linecap="round"/>
  <path d="M850 222 l 12 8 -12 8" fill="none" stroke="#503B96" stroke-width="3" opacity=".75"
        stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ── 3 · Quien tiene que aprobarla recibe la recomendación y la respalda ── -->
  <circle cx="1094" cy="250" r="84" fill="#E9E4F3"/>
  <circle cx="1094" cy="222" r="28" fill="none" stroke="#503B96" stroke-width="6.5"/>
  <path d="M1044 312 a50 34 0 0 1 100 0" fill="none" stroke="#503B96" stroke-width="6.5" stroke-linecap="round"/>

  <g filter="url(#ilu-otra-mitad-sombra)">
    <rect x="868" y="160" width="168" height="150" rx="14" fill="#FFFFFF"/>
  </g>
  <rect x="892" y="186" width="80" height="8" rx="4" fill="#303651" opacity=".85"/>
  <rect x="892" y="202" width="112" height="8" rx="4" fill="#303651" opacity=".28"/>
  <use href="#ilu-otra-mitad-cifra" x="892" y="224"/>
  <rect x="974" y="238" width="12" height="26" rx="4" fill="#503B96" opacity=".35"/>
  <rect x="992" y="226" width="12" height="38" rx="4" fill="#503B96" opacity=".55"/>
  <rect x="1010" y="214" width="12" height="50" rx="4" fill="#503B96"/>
  <!-- el sello de la U1: ahora es la decisión que alguien puede respaldar -->
  <circle cx="1022" cy="292" r="26" fill="#503B96"/>
  <path d="M1010 292 l 8 9 16 -18" fill="none" stroke="#fff" stroke-width="4.5"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
