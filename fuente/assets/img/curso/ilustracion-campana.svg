<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img"
     aria-label="Costo por cliente de la campaña durante seis semanas. Está por encima del promedio histórico, pero dos de las seis semanas coinciden con un feriado.">
  <!-- El caso de un vistazo: por qué el promedio engaña si no se mira el feriado -->
  <defs>
    <linearGradient id="barra" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6B54B0"/><stop offset="100%" stop-color="#503B96"/>
    </linearGradient>
    <linearGradient id="barraAlta" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#503B96"/><stop offset="100%" stop-color="#3B2B70"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" rx="18" fill="#FBF8F3"/>

  <!-- Franja del feriado -->
  <rect x="437" y="52" width="316" height="288" rx="12" fill="#F8B716" opacity=".14"/>
  <text x="595" y="80" text-anchor="middle" font-family="DM Sans, system-ui, sans-serif"
        font-size="17" font-weight="600" fill="#8A6100" letter-spacing="1.4">FERIADO</text>

  <!-- Barras · semanas 1 a 6 -->
  <g>
    <rect x="140" y="190" width="110" height="150" rx="10" fill="url(#barra)"/>
    <rect x="300" y="175" width="110" height="165" rx="10" fill="url(#barra)"/>
    <rect x="460" y="100" width="110" height="240" rx="10" fill="url(#barraAlta)"/>
    <rect x="620" y="88"  width="110" height="252" rx="10" fill="url(#barraAlta)"/>
    <rect x="780" y="170" width="110" height="170" rx="10" fill="url(#barra)"/>
    <rect x="940" y="180" width="110" height="160" rx="10" fill="url(#barra)"/>
  </g>

  <!-- Base -->
  <rect x="120" y="340" width="950" height="3" rx="1.5" fill="#303651" opacity=".18"/>

  <!-- Promedio histórico -->
  <line x1="120" y1="160" x2="1070" y2="160" stroke="#F8B716" stroke-width="3.5" stroke-dasharray="10 8" stroke-linecap="round"/>
  <text x="1080" y="155" font-family="DM Sans, system-ui, sans-serif" font-size="17" font-weight="600" fill="#8A6100">Promedio</text>
  <text x="1080" y="176" font-family="DM Sans, system-ui, sans-serif" font-size="17" font-weight="600" fill="#8A6100">histórico</text>

  <!-- Etiquetas de semana -->
  <g font-family="DM Sans, system-ui, sans-serif" font-size="16" fill="#303651" opacity=".55" text-anchor="middle">
    <text x="195" y="372">S1</text><text x="355" y="372">S2</text><text x="515" y="372">S3</text>
    <text x="675" y="372">S4</text><text x="835" y="372">S5</text><text x="995" y="372">S6</text>
  </g>

  <!-- Título del gráfico -->
  <text x="120" y="38" font-family="DM Sans, system-ui, sans-serif" font-size="20" font-weight="600" fill="#303651">
    Costo por cliente adquirido · 6 semanas de campaña
  </text>
</svg>
